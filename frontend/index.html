<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeArena — Live Coding Contest</title>
    <meta name="description" content="Live coding competition platform. Submit code, earn Activity Points, climb the leaderboard." />

    <!-- ── DNS & connection hints ─────────────────────────────────────────── -->
    <!-- Speed up Google Fonts requests -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Firebase & API (adjust origin if self-hosted) -->
    <link rel="dns-prefetch" href="https://firebaseapp.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />

    <!-- ── Critical CSS (inlined) ─────────────────────────────────────────
         Eliminates the render-blocking CSS delay (was 356 ms).
         Only above-the-fold styles: dark body, background, flex layout.
         The full Tailwind bundle still loads asynchronously below.
    ──────────────────────────────────────────────────────────────────────── -->
    <style id="critical-css">
      /* Reset */
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; padding: 0; }

      /* Prevent white-flash before React hydrates */
      body {
        background-color: #0a0f1a;
        color: #fff;
        font-family: system-ui, sans-serif; /* system font first — no FOIT */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* LCP container background: rendered immediately, no waiting for CSS bundle */
      .particles-bg {
        background:
          radial-gradient(ellipse at 10% 50%, rgba(41,82,247,.08) 0%, transparent 60%),
          radial-gradient(ellipse at 90% 20%, rgba(76,121,251,.06) 0%, transparent 60%),
          radial-gradient(ellipse at 50% 100%, rgba(20,35,208,.05) 0%, transparent 60%),
          #0a0f1a;
      }

      /* Skeleton / loading guard so layout doesn't shift when React mounts */
      #root:empty {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      #root:empty::after {
        content: '';
        width: 36px; height: 36px;
        border: 3px solid rgba(41,82,247,.3);
        border-top-color: #2952f7;
        border-radius: 50%;
        animation: _spin .7s linear infinite;
      }
      @keyframes _spin { to { transform: rotate(360deg); } }

      /* Font styling with smooth system fallbacks */
      body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      code, pre, .font-mono {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>

    <!-- ── Async Google Fonts (non-blocking) ──────────────────────────────
         print/onload trick: browser fetches the CSS as low-priority (print),
         then switches to all media on load — never blocks rendering.
         The @font-face declarations above already cover the critical path,
         so this is just for the full weight/subset coverage.
    ──────────────────────────────────────────────────────────────────────── -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=optional"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=optional" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite injects modulepreload links for chunks automatically at build time -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
