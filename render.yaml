services:
  - type: web
    name: contest-platform-backend
    env: node
    region: oregon           # Choose region closest to your users
    plan: free
    buildCommand: |
      cd backend
      npm install
      npm run prisma:generate
      npm run build
    startCommand: cd backend && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: COLLEGE_EMAIL_DOMAIN
        sync: false          # Set in Render dashboard
      - key: ADMIN_EMAIL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: DATABASE_URL
        sync: false          # TiDB Serverless connection string
      - key: REDIS_URL
        fromService:
          type: redis
          name: contest-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-20240307
      - key: JUDGE0_API_URL
        value: https://ce.judge0.com
      - key: FRONTEND_URL
        sync: false          # Your Vercel URL
      - key: CONTEST_DURATION_MINUTES
        value: 180
      - key: MAX_PARTICIPANTS
        value: 500
      - key: SKIP_LOCKOUT_MINUTES
        value: 10
      - key: AP_AI_WEIGHT
        value: 0.3
      - key: AP_BASE_EASY
        value: 100
      - key: AP_BASE_MEDIUM
        value: 200
      - key: AP_BASE_HARD
        value: 350

  - type: redis
    name: contest-redis
    plan: free
    region: oregon           # Must match backend region
    maxmemoryPolicy: allkeys-lru  # Important: evict LRU keys when 25MB limit hit
